<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully prevent unhandled Vite HMR WebSocket connection closure in sandbox iFrame proxy
      window.addEventListener('unhandledrejection', function(event) {
        if (
          event.reason &&
          (event.reason.message?.includes('WebSocket') ||
           event.reason.stack?.includes('@vite/client') ||
           event.reason.message?.includes('closed without opened'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          event.message?.includes('WebSocket') ||
          event.filename?.includes('@vite/client')
        ) {
          event.preventDefault();
        }
      });

      // Synchronous theme initialization to avoid flash of wrong theme
      (function() {
        try {
          var saved = localStorage.getItem('eximora_theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (prefersDark) {
            document.documentElement.classList.add('dark');
          } else {
            // Default to dark luxury theme or light if system prefers
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <title>Eximora — Cross-Border Two-Way Trading House</title>
    <meta name="description" content="Eximora — Two-way cross-border trading house. Exporting Indian food products globally, importing electronic accessories for Indian commerce." />
    <meta property="og:title" content="Eximora — Cross-Border Two-Way Trading House" />
    <meta property="og:description" content="Eximora — Two-way cross-border trading house. Exporting Indian food products globally, importing electronic accessories for Indian commerce." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8F9FB] dark:bg-[#08080A] text-slate-900 dark:text-slate-100 antialiased selection:bg-amber-400/20 selection:text-amber-800 dark:selection:text-amber-200 overflow-x-hidden min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
